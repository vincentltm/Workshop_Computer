Name: Bends
short-description: 6-Stage Stereo Multi-FX, Glitch Looper & Digital Degradation Engine
Language: C++
Creator: Vincent Maurer
Version: 1.0.0
Status: Released
License: MIT
date-created: 2026-08-02
contact:
  website: https://vincentmaurer.de
  social:
    github: https://github.com/vincentltm
    youtube: https://www.youtube.com/@vincentltm

tags:
  - multi-fx
  - delay
  - reverb
  - glitch
  - looper
  - filter
  - chorus
  - bitcrush

summary: |
  Bends is a 6-stage stereo multi-effects processor, live stutter looper, and signal degradation engine. Inspired by 90s circuit-bent rack units, Bends turns memory corruption, bitwise XOR data bus shorting, and lossy compression into an instrument spanning clean stereo chorus and reverbs to mangled breakbeat slicing, internal Turing Machine pitch sequences, and generative S&H CV.

demo-link: https://www.youtube.com/watch?v=-rACWw0J_zI

panel:
  inputs:
    - id: AudioIn1
      name: Audio 1
      description: Stereo left audio input (normalled to Right if Audio 2 is unplugged)
      type: audio
    - id: AudioIn2
      name: Audio 2
      description: Stereo right audio input (unplug for ~2.73s Extended Mono Mode)
      type: audio
    - id: CVIn1
      name: CV 1
      description: Bipolar CV input modulating primary page parameter or tuned 1V/Oct pitch
      type: cv
    - id: CVIn2
      name: CV 2
      description: Bipolar CV input modulating secondary page parameter and glitch/reverb depth
      type: cv
    - id: PulseIn1
      name: Clock Sync
      description: External clock pulse sync (1, 2, 4, and 24 PPQN DIN Sync) for delay subdivisions, loop stepping, and pitch CV
      type: pulse
    - id: PulseIn2
      name: Freeze Gate
      description: Gate input (> +1.2V) locking delay & glitch looper buffers into live freeze
      type: pulse

  outputs:
    - id: AudioOut1
      name: Out 1
      description: Main processed stereo left audio output
      type: audio
    - id: AudioOut2
      name: Out 2
      description: Main processed stereo right audio output
      type: audio
    - id: CVOut1
      name: Pitch CV
      description: Clocked Turing Machine 1V/Oct semitone sequence output (controlled by Glitcher Y knob)
      type: cv
    - id: CVOut2
      name: Random CV
      description: Stepped Random Sample & Hold CV output
      type: cv
    - id: PulseOut1
      name: Loop Trig
      description: +5V 2ms trigger pulse output emitted on loop resets or clock steps
      type: pulse
    - id: PulseOut2
      name: Texture
      description: Lo-fi microsound bleeps and vinyl crackle driven by Loss Page (active when no inputs connected)
      type: pulse

controls:
  switch:
    up:
      name: Freeze Mode
      description: Flick UP to lock buffer into live granular freeze
    middle:
      name: Perform Mode
      description: Normal live processing across pages 1 to 6
    down:
      name: Global Mode
      description: Hold DOWN to adjust Global settings (Bend, Width, Routing). Automatically saves state after 3s.
    tap:
      name: Page Step
      description: Tap DOWN (<350ms) to cycle forward through effect pages 1 to 6
  knobs:
    - when: { panel: page-0-global }
      main:
        name: Bend
        description: Bend Macro — adjusts all degradation parameters at once (noise, bitcrush fuzz, distortion, and dropouts)
      x:
        name: Width & Mode
        description: "Stereo Width (Left: Extended Mono Mode, Center: Stereo Width 0–100%, Right: Dual Mono Mode)"
      y:
        name: Routing & Reset
        description: "Selects effects chain: 1. CLDGFR, 2. RFCDGL, 3. GLDCFR, 4. FLCDGR, 5. Clean Reset (>96%)"

    - when: { panel: page-1-chorus }
      main:
        name: Chorus Mix
        description: Blends dry input audio with stereo chorus
      x:
        name: LFO Speed
        description: LFO Speed / Pitch (high Y values turn chorus into Karplus-Strong string resonator; X + CV1 set pitch)
      y:
        name: Depth / Feedback
        description: Chorus Depth / Feedback (high Y >75% turns chorus into Karplus-Strong string resonator)

    - when: { panel: page-2-codec }
      main:
        name: Loss Mix
        description: Blends clean audio with digital degradation
      x:
        name: Crush Type
        description: Blends continuously between Tape, MP3 Ringing, Bitcrush, and Decimation loss
      y:
        name: Jitter Type
        description: Blends continuously between Tape Wow/Flutter, Packet Dropouts, and CD Sputter / random XOR glitches

    - when: { panel: page-3-delay }
      main:
        name: Delay Mix
        description: Blends dry input audio with delay repeats
      x:
        name: Delay Time
        description: Delay Time (snaps to subdivisions when clock is present; short times + feedback = resonator)
      y:
        name: Feedback
        description: Repeat feedback level (overdrives into digital XOR glitches at high values)

    - when: { panel: page-4-glitcher }
      main:
        name: Glitch Probability
        description: Glitch Probability and looper wet/dry blend
      x:
        name: Glitch Length
        description: Glitch Length (snaps to subdivisions when clock is present)
      y:
        name: Glitch Type
        description: "Glitch Type: Stutter, Stutter + Reverse, or Stutter + Reverse + Random Pitch (controls Turing Machine sequence on Pitch CV Out)"

    - when: { panel: page-4-freeze }
      main:
        name: Block Position
        description: "Scrubs buffer position (CCW: Auto LFO, Center: Manual, CW: Random Skip; snaps to clock when present)"
      x:
        name: Block Length
        description: Freeze block length (snaps to subdivisions when clock is present)
      y:
        name: Pitch Shift
        description: Continuous grain pitch shift with detents (-1st Octave to +1st Octave)

    - when: { panel: page-5-filter }
      main:
        name: Filter Cutoff
        description: Filter Cutoff (Lowpass CCW ↔ Highpass CW)
      x:
        name: Resonance
        description: Filter Resonance (self-oscillates at high settings; CV1 acts as 1V/Oct pitch input)
      y:
        name: Drive / Fuzz
        description: Wavefolder drive fuzz level and saturation depth

    - when: { panel: page-6-reverb }
      main:
        name: Reverb Mix
        description: Reverb wet/dry blend
      x:
        name: Size / Type
        description: Blends from Spring Reverb (left) to Hall Reverb (right) while adjusting room size
      y:
        name: Damping
        description: Damping (higher values lead to bitcrushing in the reverb feedback loop)

  leds:
    - display: list
      items:
        - id: LED0
          name: Routing 1 / Chorus LED
          description: Illuminates for 1. CLDGFR (Series FX) routing or Page 1 active LED
        - id: LED1
          name: Routing 2 / Loss LED
          description: Illuminates for 2. RFCDGL (Space Wash) routing or Page 2 active LED
        - id: LED2
          name: Routing 3 / Delay LED
          description: Illuminates for 3. GLDCFR (Scatter Cloud) routing or Page 3 active LED
        - id: LED3
          name: Routing 4 / Glitcher LED
          description: Illuminates for 4. FLCDGR (Filtered Dub) routing or Page 4 active LED
        - id: LED4
          name: Dual Mono / Filter LED
          description: Illuminates when Dual Mono mode is active or Page 5 active LED
        - id: LED5
          name: Extended Mono / Reverb LED
          description: Illuminates when Extended Mono mode is active or Page 6 active LED
